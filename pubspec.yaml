name: vibration_checker
description: OTIS 승강기 진동·소음 측정 및 TUNE 리포트 앱
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.12.0

dependencies:
  fl_chart: ^1.2.0
  flutter:
    sdk: flutter
  flutter_email_sender: ^10.0.1
  go_router: ^17.3.0
  intl: ^0.20.3
  path_provider: ^2.1.6
  pdf: ^3.13.0
  shared_preferences: ^2.5.5
  wakelock_plus: ^1.6.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  crypto: ^3.0.7

flutter:
  uses-material-design: true

  # 리포트 서식 이미지와 한글 폰트. 폰트를 fonts: 가 아니라 assets: 로
  # 두는 이유는 Flutter 위젯이 쓰는 글꼴이 아니라 pdf 패키지가 실행 중에
  # 파일째 읽어 PDF 에 심는 자산이기 때문이다
  assets:
    - assets/report/

