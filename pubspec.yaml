name: vibration_checker
description: OTIS 승강기 진동·소음 측정 및 TUNE 리포트 앱
publish_to: 'none'
version: 0.0.1+2

environment:
  sdk: ^3.12.0

dependencies:
  flutter:
    sdk: flutter
  flutter_email_sender: ^10.0.1
  go_router: ^17.3.0
  http: ^1.6.0
  intl: ^0.20.3
  package_info_plus: ^10.2.2
  path_provider: ^2.1.6
  pdf: ^3.13.0
  shared_preferences: ^2.5.5
  wakelock_plus: ^1.6.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  crypto: ^3.0.7
  # 저장소 시험에서 기준 폴더를 임시 폴더로 바꿔 끼우는 데만 쓴다.
  # 제품 코드는 path_provider 만 쓰고 이 패키지를 직접 부르지 않는다
  path_provider_platform_interface: ^2.1.3
  # 메일 시트 시험에서 메일 앱 작성창 자리를 가짜로 바꿔 끼워, 넘어가는
  # 첨부 · 본문을 받아 보는 데만 쓴다. 제품 코드는 flutter_email_sender 만
  # 쓰고 이 패키지를 직접 부르지 않는다
  flutter_email_sender_platform_interface: ^1.0.0
  # 앱 아이콘(mipmap-*)을 assets/icon/ 원본에서 만드는 데만 쓴다.
  # `dart run flutter_launcher_icons` 로 돌리고 앱에는 들어가지 않는다
  flutter_launcher_icons: ^0.14.4

# 앱 아이콘 생성 설정. 원본(assets/icon/)은 빌드 때만 읽으므로 아래
# flutter: assets: 에 넣지 않는다 — 넣으면 APK 에 원본이 함께 들어간다.
# 안드로이드 8 이상은 배경 · 전경 두 겹(적응형 아이콘, 런처가 원 · 둥근
# 사각 등으로 잘라 씀), 그 아래는 legacy 한 장을 쓴다
flutter_launcher_icons:
  android: true
  ios: false
  image_path: assets/icon/ic_launcher_legacy.png
  adaptive_icon_background: assets/icon/ic_adaptive_background.png
  adaptive_icon_foreground: assets/icon/ic_adaptive_foreground.png
  # 전경 원본이 이미 안전 영역(가운데 66/108) 안에 그려져 있어 여백을
  # 더하지 않는다. 기본값 16% 를 두면 내용이 그만큼 더 작아진다
  adaptive_icon_foreground_inset: 0

flutter:
  uses-material-design: true

  # 리포트 서식 이미지와 한글 폰트. 폰트를 fonts: 가 아니라 assets: 로
  # 두는 이유는 Flutter 위젯이 쓰는 글꼴이 아니라 pdf 패키지가 실행 중에
  # 파일째 읽어 PDF 에 심는 자산이기 때문이다
  assets:
    - assets/report/

