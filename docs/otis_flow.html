<script>
var svg=document.getElementById('s'),g=document.getElementById('v');

function apply(){g.setAttribute('transform','translate('+tx.toFixed(1)+' '+ty.toFixed(1)+') scale('+sc.toFixed(4)+')');}
/* viewBox 를 화면 CSS 픽셀과 1:1 로 유지 → 드래그 1px = 화면 1px */
function sync(){var r=svg.getBoundingClientRect();
 if(r.width>10&&r.height>10)
   svg.setAttribute('viewBox','0 0 '+Math.round(r.width)+' '+Math.round(r.height));
 return r;}
function home(){var r=sync();
 if(r.width<10){requestAnimationFrame(home);return;}   /* 배치 전이면 다음 프레임에 */
 sc=Math.max(0.55,Math.min(1.25,r.width/1500));        /* 읽을 수 있는 배율에서 시작 */
 tx=12;ty=10;apply();}
svg.addEventListener('dragstart',function(e){e.preventDefault();});
svg.addEventListener('selectstart',function(e){e.preventDefault();});
/* 포인터 캡처는 쓰지 않는다 — 캡처하면 click 이 svg 로 재지정돼 링크가 죽는다.
   pointerdown 에서도 preventDefault 하지 않는다 — click 자체가 사라진다. */
svg.addEventListener('pointerdown',function(e){if(e.pointerType==='mouse'&&e.button!==0)return;
 drag=true;moved=0;px=e.clientX;py=e.clientY;svg.classList.add('drag');});
window.addEventListener('pointermove',function(e){if(!drag)return;
 moved+=Math.abs(e.clientX-px)+Math.abs(e.clientY-py);
 tx+=e.clientX-px;ty+=e.clientY-py;px=e.clientX;py=e.clientY;apply();});
function stop(){if(!drag)return;drag=false;svg.classList.remove('drag');}

function anchorOf(el){for(var n=el;n&&n!==svg;n=n.parentNode){
 if(n.nodeName&&n.nodeName.toLowerCase()==='a')return n;}return null;}
svg.addEventListener('click',function(e){

 if(!a)return;

 if(!u)return;

window.addEventListener('resize',function(){sync();apply();});
home();window.addEventListener('load',home);
