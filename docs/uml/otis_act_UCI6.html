  for(let i=0;i+1<pts.length;i++) SEGS.push({e:a+"|"+b,s:[pts[i][0],pts[i][1],pts[i+1][0],pts[i+1][1]]});
});
// 노드
D.N.forEach(([id,k,name,x,y,desc,fns,doc])=>{
  const a=el("a",doc?{class:"nd dim",href:doc}:{class:"nd dim",href:url(fns[0]),target:"_blank",rel:"noopener"});
  a.dataset.key=id;
  const ti=el("title");
  ti.textContent=(id+". "+(name?name.replace(/\n/g," "):KIND[k]))+(D.COND[id]?"  ["+D.COND[id]+"]":"")+"\n"+desc+
    (doc?"\n(누르면 그 흐름의 액티비티 다이어그램으로 이동)":"")+"\n\n"+fnl(fns);
  a.appendChild(ti);
  let l,t2;
  if(k==="initial"){ a.appendChild(el("circle",{class:"term shape",cx:x,cy:y,r:11})); l=x-11; t2=y-11; }
  else if(k==="final"){ a.appendChild(el("circle",{class:"termring shape",cx:x,cy:y,r:12}));
                        a.appendChild(el("circle",{class:"term",cx:x,cy:y,r:6.5})); l=x-12; t2=y-12; }
  else if(k==="decision"){ a.appendChild(el("path",{class:"shape",d:`M${x},${y-DH} L${x+DW},${y} L${x},${y+DH} L${x-DW},${y} Z`})); l=x-DW; t2=y-DH; }
  else if(k==="merge"){ a.appendChild(el("path",{class:"shape",d:`M${x},${y-13} L${x+18},${y} L${x},${y+13} L${x-18},${y} Z`})); l=x-18; t2=y-13; }
  else{
    a.appendChild(el("rect",{class:"shape",x:x-BW/2,y:y-BH/2,width:BW,height:BH,rx:k==="call"?3:14}));
    if(k==="call"){ const bx=x+BW/2-16, by=y+BH/2-15;
      a.appendChild(el("path",{class:"rake",d:`M${bx-7},${by} h14 M${bx-7},${by} v9 M${bx},${by} v9 M${bx+7},${by} v9`})); }
    l=x-BW/2; t2=y-BH/2;
  }
  if(name){
    const lines=name.split("\n");
    lines.forEach((ln,i)=>{
      const tt=el("text",{class:"lb",x:k==="call"?x-6:x,y:y+(lines.length===1?4.5:(i===0?-4:15))});
      tt.textContent=ln; a.appendChild(tt);
    });
  }
  const nm=el("text",{class:"num",x:l-4,y:t2+2}); nm.textContent=id; a.appendChild(nm);
  ng.appendChild(a);
});

// 글자 자리: 노드 · 선 · 다른 글자 · 반복 구간 테두리와 겹치지 않는 첫 후보
function nodeBox(n){
  const [,k,,x,y]=n;
  if(k==="decision") return {x:x-DW,y:y-DH,w:DW*2,h:DH*2};
  if(k==="merge")    return {x:x-18,y:y-13,w:36,h:26};
  if(k==="initial"||k==="final") return {x:x-13,y:y-13,w:26,h:26};
  return {x:x-BW/2,y:y-BH/2,w:BW,h:BH};
}
const BOXES=D.N.map(n=>Object.assign({id:String(n[0])},nodeBox(n)));
const TXT=[...gr.querySelectorAll('text'),...ng.querySelectorAll('text.num')].map(t=>{const b=t.getBBox();return {x:b.x,y:b.y,w:b.width,h:b.height};});
const REPSEG=[];
D.REP.forEach(r=>{REPSEG.push([r.x,r.y,r.x+r.w,r.y],[r.x,r.y+r.h,r.x+r.w,r.y+r.h],[r.x,r.y,r.x,r.y+r.h],[r.x+r.w,r.y,r.x+r.w,r.y+r.h]);});
function free(r,selfId,selfEdge){
  if(r.x<2||r.y<2||r.x+r.w>VB.width-2||r.y+r.h>VB.height-2) return false;
  if(BOXES.some(b=>b.id!==selfId&&boxHit(r,b))) return false;
  if(TXT.some(b=>boxHit(r,b))) return false;
  if(SEGS.some(s=>s.e!==selfEdge&&segHit(r,s.s))) return false;
  if(REPSEG.some(s=>segHit(r,s))) return false;
  return true;
}
const MISS=[];
// 흐름선 라벨
D.E.forEach(([a,b,d,lab,kd,cands,opt])=>{
  if(!lab) return;
  const t=el("text",{class:"g dim "+(kd||""),x:0,y:0});
  t.textContent=lab; t.dataset.e=a+"|"+b; gl.appendChild(t);
  let ok=null;
  for(const [x,y,an] of cands){
    t.setAttribute("x",x); t.setAttribute("y",y); t.setAttribute("text-anchor",an);
    const bb=t.getBBox(), r={x:bb.x-2,y:bb.y-1,w:bb.width+4,h:bb.height+2};
    if(free(r,null,a+"|"+b)){ok=r;break;}
  }
  if(!ok&&opt){ t.remove(); return; }
  if(!ok){ const [x,y,an]=cands[0]; t.setAttribute("x",x); t.setAttribute("y",y); t.setAttribute("text-anchor",an);
    const bb=t.getBBox(); ok={x:bb.x,y:bb.y,w:bb.width,h:bb.height}; MISS.push("선라벨 "+a+"→"+b); }
  TXT.push(ok);
});
// 분기 조건 문구
D.N.forEach(([id,k,,x,y])=>{
  if(k!=="decision"||!D.COND[id]) return;
  const a=ng.querySelector('[data-key="'+id+'"]');
  const cands=[
    [x+DW+10, y-DH-4,  "start"],
    [x-DW-10, y-DH-4,  "end"],
    [x+DW+12, y+4,     "start"],
    [x-DW-12, y+4,     "end"],
    [x,       y-DH-14, "middle"],
    [x+DW+10, y+DH+14, "start"],
    [x-DW-10, y+DH+14, "end"],
    [x+DW+10, y-DH-22, "start"],
    [x-DW-10, y-DH-22, "end"]
  ];
  const ct=el("text",{class:"cnd",x:0,y:0,"text-anchor":"middle"});
  ct.textContent="["+D.COND[id]+"]";
  a.appendChild(ct);
  let placed=null;
  for(const [cx,cy,an] of cands){
    ct.setAttribute("x",cx); ct.setAttribute("y",cy); ct.setAttribute("text-anchor",an);
    const b=ct.getBBox();
    const r={x:b.x-6,y:b.y-2,w:b.width+12,h:b.height+4};
    if(free(r,String(id),null)){ placed=r; break; }
  }
  if(!placed){
    const [cx,cy,an]=cands[0];
    ct.setAttribute("x",cx); ct.setAttribute("y",cy); ct.setAttribute("text-anchor",an);
    const b=ct.getBBox(); placed={x:b.x-6,y:b.y-2,w:b.width+12,h:b.height+4};
    MISS.push("조건 "+id);
  }
  const bg=el("rect",{class:"cndbg",x:placed.x,y:placed.y,width:placed.w,height:placed.h,rx:2});
  a.insertBefore(bg,ct);
  TXT.push(placed);
});
window.__LABEL_MISS=MISS;
if(MISS.length) console.warn("글자 자리 없음: "+MISS.join(", "));

const nodes=[...ng.querySelectorAll('[data-key]')];
const edges=[...svg.querySelectorAll('[data-e]')];
function iso(id){
  svg.querySelectorAll('.lit').forEach(e=>e.classList.remove('lit'));
  if(!id){svg.classList.remove('iso');return;}
  svg.classList.add('iso');
  const keep=new Set([String(id)]);
  edges.forEach(e=>{const p=e.dataset.e.split('|');
    if(p[0]===String(id)||p[1]===String(id)){e.classList.add('lit');keep.add(p[0]);keep.add(p[1]);}});
  nodes.forEach(n=>{if(keep.has(n.dataset.key))n.classList.add('lit');});
}
nodes.forEach(n=>{
  const k=+n.dataset.key;
  n.addEventListener('mouseenter',()=>iso(k));
  n.addEventListener('mouseleave',()=>iso(null));
  n.addEventListener('focus',()=>iso(k));
  n.addEventListener('blur',()=>iso(null));
});

</script>
