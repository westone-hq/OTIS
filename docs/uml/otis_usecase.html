       position:sticky;top:0;z-index:20;backdrop-filter:blur(4px)}

  .nav a:hover{text-decoration:underline}
  .nav .sep{color:var(--ink3)}
  .nav .cur{font-weight:800;color:var(--ink)}
  .nav .tabs{display:flex;gap:0;margin-left:6px;border:1px solid var(--rule);border-radius:3px;overflow:hidden}
  .nav .tabs a,.nav .tabs span{padding:3px 12px;font-weight:600;font-size:12.5px;
       background:var(--card);color:var(--signal);text-decoration:none}
  .nav .tabs a:hover{background:var(--signal-soft);text-decoration:none}
  .nav .tabs .on{background:var(--signal);color:#fff}
  .nav .tabs .off{color:var(--ink3);background:#F2F5F7;cursor:default}
  .nav .right{margin-left:auto;display:flex;gap:14px;align-items:center;flex-wrap:wrap}
  .nav .right a{font-weight:600;font-size:12.5px}

  .stage{padding:24px}
  .boundary{fill:rgba(255,255,255,.66);stroke:var(--rule);stroke-width:1.5}
  .btitle{font-size:15px;font-weight:700;fill:var(--ink2);text-anchor:middle}
  a.nd{text-decoration:none;cursor:pointer}
  a.nd ellipse{fill:var(--card);stroke:var(--ink2);stroke-width:1.4;transition:fill .15s,stroke .15s}

  a.nd:hover text,a.nd:focus text{fill:var(--signal);font-weight:700}
  .actor .fig{stroke:var(--ink);stroke-width:1.6;fill:none;stroke-linecap:round}
  .actor .head{fill:var(--card)}
  .actor text{font-size:13.5px;fill:var(--ink);text-anchor:middle;font-weight:600;pointer-events:none}
  a.actor:hover .fig{stroke:var(--signal)}
  .assoc{stroke:var(--ink2);stroke-width:1.3;fill:none}
  .inc{stroke:var(--ink2);stroke-width:1.3;fill:none;stroke-dasharray:7 5}
  .ext{stroke:var(--extend);stroke-width:1.4;fill:none;stroke-dasharray:7 5}
  .lbl{font-size:12px;fill:var(--ink2);font-weight:600}
  .lbl.e{fill:var(--extend)}
  .lg rect{fill:rgba(255,255,255,.92);stroke:var(--rule);stroke-width:1}
  .lg .lt{font-size:11.5px;font-weight:800;fill:var(--extend);letter-spacing:.08em}
  .lg .lx{font-size:12.5px;fill:var(--ink2)}
</style>

function segHit(r,s){

  if(Math.abs(x1-x2)<.5){ if(!(r.x<x1&&x1<r.x+r.w))return false;
    return Math.max(Math.min(y1,y2),r.y)<Math.min(Math.max(y1,y2),r.y+r.h); }
  if(Math.abs(y1-y2)<.5){ if(!(r.y<y1&&y1<r.y+r.h))return false;
    return Math.max(Math.min(x1,x2),r.x)<Math.min(Math.max(x1,x2),r.x+r.w); }
  // 비스듬한 선: 잘게 나눠 점으로 본다
  for(let i=0;i<=40;i++){const t=i/40,x=x1+(x2-x1)*t,y=y1+(y2-y1)*t;
    if(r.x<x&&x<r.x+r.w&&r.y<y&&y<r.y+r.h)return true;}
  return false;
}

// 연결선 글자: 선 옆 빈 자리
function ellHit(r,e){const [cx,cy,rx,ry]=e;
  const nx=Math.max(r.x,Math.min(cx,r.x+r.w)), ny=Math.max(r.y,Math.min(cy,r.y+r.h));
  return ((nx-cx)/rx)**2+((ny-cy)/ry)**2<1;}
const PLACED=[]; const MISS=[];
D.E.forEach(e=>{
  if(!e.lab) return;
  const s=SEGS.find(z=>z.e===e.e).s;
  const t=el("text",{class:"lbl dim"+(e.cls==="ext"?" e":""),x:0,y:0}); t.textContent=e.lab; t.dataset.e=e.e; gl.appendChild(t);
  const len=Math.hypot(s[2]-s[0],s[3]-s[1]), nx=-(s[3]-s[1])/len, ny=(s[2]-s[0])/len;
  let ok=null;
  outer: for(const f of [0.5,0.4,0.6,0.3,0.7,0.2,0.8,0.15,0.85]){
    for(const off of [-9,9,-14,14,-20,20]){
      const px=s[0]+(s[2]-s[0])*f+nx*off, py=s[1]+(s[3]-s[1])*f+ny*off;
      t.setAttribute("x",px); t.setAttribute("y",py+4);
      for(const an of ["middle","start","end"]){
        t.setAttribute("text-anchor",an);
        const b=t.getBBox(), r={x:b.x-2,y:b.y-1,w:b.width+4,h:b.height+2};
        if(r.x<2||r.y<2||r.x+r.w>VB.width-2||r.y+r.h>VB.height-2) continue;
        if(SEGS.some(z=>segHit(r,z.s))) continue;
        if(BOXES.some(bx=>bx.ell?ellHit(r,bx.ell):boxHit(r,bx))) continue;
        if(PLACED.some(p=>boxHit(r,p))) continue;
        ok=r; break outer;
      }
    }
  }
  if(!ok){MISS.push(e.e);} else PLACED.push(ok);
});
window.__LABEL_MISS=MISS;
const nodes=[...svg.querySelectorAll('[data-key]')];
const edges=[...svg.querySelectorAll('[data-e]')];
function iso(k){
  svg.querySelectorAll('.lit').forEach(e=>e.classList.remove('lit'));
  if(!k){svg.classList.remove('iso');return;}
  svg.classList.add('iso');
  const keep=new Set([k,'__bd']);
  edges.forEach(e=>{const p=e.dataset.e.split('|');
    if(p[0]===k||p[1]===k){e.classList.add('lit');keep.add(p[0]);keep.add(p[1]);}});
  if(k==='UCE1'||k==='UC09') keep.add('__lg');
  nodes.forEach(n=>{if(keep.has(n.dataset.key))n.classList.add('lit');});
}
nodes.forEach(n=>{
  const k=n.dataset.key; if(k.startsWith('__'))return;
  n.addEventListener('mouseenter',()=>iso(k));
  n.addEventListener('mouseleave',()=>iso(null));
  n.addEventListener('focus',()=>iso(k));
  n.addEventListener('blur',()=>iso(null));
});
