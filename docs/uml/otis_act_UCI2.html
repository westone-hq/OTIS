<style>

  .nav .tabs a:hover{background:var(--signal-soft);text-decoration:none}
  .nav .tabs .on{background:var(--signal);color:#fff}

  .nav .right{margin-left:auto;display:flex;gap:14px;align-items:center;flex-wrap:wrap}

  .stage{padding:24px;max-width:1180px;margin:0 auto}
  a.nd{text-decoration:none;cursor:pointer}
  a.nd .shape{fill:var(--card);stroke:var(--ink2);stroke-width:1.4;transition:fill .15s,stroke .15s}
  a.nd .rake{fill:none;stroke:var(--ink2);stroke-width:1.4}

  a.nd:hover .lb,a.nd:focus .lb{fill:var(--signal);font-weight:700}
  a.nd .cnd{font-size:12px;fill:var(--ink);font-weight:700;pointer-events:none}
  a.nd:hover .cnd,a.nd:focus .cnd{fill:var(--signal)}
  a.nd .cndbg{fill:var(--card);stroke:none;pointer-events:none}
  a.nd .term{fill:var(--ink);stroke:none}
  a.nd .termring{fill:var(--card);stroke:var(--ink);stroke-width:1.6}
  .flow{stroke:var(--ink2);stroke-width:1.3;fill:none}
  .flow.back{stroke:var(--extend)}
  .g{font-size:11.5px;font-weight:600;fill:var(--ink2)}
  .g.t{fill:var(--signal)}
  .g.f{fill:var(--ink2)}
  .g.back{fill:var(--extend)}
  .rep{fill:none;stroke:var(--extend);stroke-width:1.2;stroke-dasharray:6 4}
  .repl{font-size:11.5px;fill:var(--extend);font-weight:700}

<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,1 L9,5 L0,9 Z" fill="context-stroke"/></marker></defs>

<script>
const B="https://github.com/westone-hq/OTIS/blob/1c9d689a9802fe6703929b632845bce648b1cef6/";
const C=560,BW=212,BH=50,DW=26,DH=19;
const D={"N": [[1, "initial", "", 560, 44, "시작 화면의 ‘측정 시작’이나 결과 화면의 ‘테스트 재실행’에서 이 흐름이 돈다.", [{"n": "ensureMicPermission()", "p": "lib/ui/features/measure/mic_permission.dart", "a": 5, "b": 34}, {"n": "_startMeasuring()", "p": "lib/ui/features/measure/start_screen.dart", "a": 123, "b": 145}, {"n": "_rerun()", "p": "lib/ui/features/result/result_screen.dart", "a": 231, "b": 288}], null], [2, "action", "안드로이드에 마이크\n권한을 요청한다", 560, 106.0, "", [{"n": "requestAudioPermission()", "p": "lib/adapter/sensor/sensor_channel.dart", "a": 214, "b": 237}, {"n": "ensureMicPermission()", "p": "lib/ui/features/measure/mic_permission.dart", "a": 5, "b": 34}], null], [3, "decision", "", 560, 176.0, "", [{"n": "requestAudioPermission()", "p": "android/app/src/main/kotlin/com/otis/vibration_checker/sensor/SensorMethodHandler.kt", "a": 164, "b": 200}], null], [4, "action", "허용됐다고 바로 답한다", 900, 176.0, "권한 창을 띄우지 않는다.", [{"n": "requestAudioPermission()", "p": "android/app/src/main/kotlin/com/otis/vibration_checker/sensor/SensorMethodHandler.kt", "a": 164, "b": 200}], null], [5, "decision", "", 560, 248.0, "앞 요청의 응답 자리를 덮어쓰면 앞 요청이 끝내 응답을 못 받으므로 겹친 요청은 바로 거절한다.", [{"n": "requestAudioPermission()", "p": "android/app/src/main/kotlin/com/otis/vibration_checker/sensor/SensorMethodHandler.kt", "a": 164, "b": 200}], null], [6, "action", "겹친 요청은 거부로 답한다", 220, 248.0, "", [{"n": "requestAudioPermission()", "p": "android/app/src/main/kotlin/com/otis/vibration_checker/sensor/SensorMethodHandler.kt", "a": 164, "b": 200}], null], [7, "action", "시스템 권한 창을 띄운다", 560, 326.0, "", [{"n": "requestAudioPermission()", "p": "android/app/src/main/kotlin/com/otis/vibration_checker/sensor/SensorMethodHandler.kt", "a": 164, "b": 200}], null], [8, "action", "작업자가 허용 · 거부를\n고른다", 560, 402.0, "안드로이드가 응답을 화면(MainActivity)으로 돌려주고, 기다리던 요청에 이어 준다.", [{"n": "onRequestPermissionsResult()", "p": "android/app/src/main/kotlin/com/otis/vibration_checker/MainActivity.kt", "a": 72, "b": 93}, {"n": "onRequestPermissionsResult()", "p": "android/app/src/main/kotlin/com/otis/vibration_checker/sensor/SensorMethodHandler.kt", "a": 364, "b": 403}], null], [9, "decision", "", 560, 472.0, "", [{"n": "onRequestPermissionsResult()", "p": "android/app/src/main/kotlin/com/otis/vibration_checker/sensor/SensorMethodHandler.kt", "a": 364, "b": 403}], null], [10, "merge", "", 560, 538.0, "권한을 받지 못한 흐름이 만난다.", [{"n": "ensureMicPermission()", "p": "lib/ui/features/measure/mic_permission.dart", "a": 5, "b": 34}], null], [11, "action", "‘마이크 권한 없음’\n확인 창을 띄운다", 560, 602.0, "“진동만 측정”을 고르면 소음 지표는 미측정(빈 값)으로 남는다.", [{"n": "ensureMicPermission()", "p": "lib/ui/features/measure/mic_permission.dart", "a": 5, "b": 34}], null], [12, "decision", "", 560, 672.0, "", [{"n": "ensureMicPermission()", "p": "lib/ui/features/measure/mic_permission.dart", "a": 5, "b": 34}], null], [13, "action", "측정하지 않는다고\n돌려준다", 560, 750.0, "“취소”를 골랐거나 창 바깥을 눌렀다.", [{"n": "ensureMicPermission()", "p": "lib/ui/features/measure/mic_permission.dart", "a": 5, "b": 34}], null], [14, "final", "", 560, 813.0, "부른 화면에 머문다.", [{"n": "ensureMicPermission()", "p": "lib/ui/features/measure/mic_permission.dart", "a": 5, "b": 34}], null], [15, "merge", "", 560, 886.0, "측정을 이어 가도 되는 흐름이 만난다.", [{"n": "ensureMicPermission()", "p": "lib/ui/features/measure/mic_permission.dart", "a": 5, "b": 34}], null], [16, "action", "측정해도 된다고\n돌려준다", 560, 950.0, "", [{"n": "ensureMicPermission()", "p": "lib/ui/features/measure/mic_permission.dart", "a": 5, "b": 34}], null], [17, "final", "", 560, 1013.0, "측정 화면으로 넘어간다.", [{"n": "ensureMicPermission()", "p": "lib/ui/features/measure/mic_permission.dart", "a": 5, "b": 34}], null]], "E": [[1, 2, "M560,55 L560,81.0", null, null, [[569, 69, "start"], [551, 69, "end"]], false], [2, 3, "M560,131.0 L560,157.0", null, null, [[569, 145.0, "start"], [551, 145.0, "end"]], false], [3, 4, "M586,176.0 L794.0,176.0", "참", "t", [[690.0, 168.0, "middle"], [690.0, 193.0, "middle"]], false], [3, 5, "M560,195.0 L560,229.0", "거짓", "f", [[569, 209.0, "start"], [551, 209.0, "end"]], false], [5, 6, "M534,248.0 L326.0,248.0", "참", "t", [[430.0, 240.0, "middle"], [430.0, 265.0, "middle"]], false], [5, 7, "M560,267.0 L560,301.0", "거짓", "f", [[569, 281.0, "start"], [551, 281.0, "end"]], false], [7, 8, "M560,351.0 L560,377.0", null, null, [[569, 365.0, "start"], [551, 365.0, "end"]], false], [8, 9, "M560,427.0 L560,453.0", null, null, [[569, 441.0, "start"], [551, 441.0, "end"]], false], [9, 10, "M560,491.0 L560,525.0", "거짓", "f", [[569, 505.0, "start"], [551, 505.0, "end"]], false], [6, 10, "M220,273.0 L220,538.0 L542,538.0", null, null, [], false], [10, 11, "M560,551.0 L560,577.0", null, null, [[569, 565.0, "start"], [551, 565.0, "end"]], false], [11, 12, "M560,627.0 L560,653.0", null, null, [[569, 641.0, "start"], [551, 641.0, "end"]], false], [12, 13, "M560,691.0 L560,725.0", "거짓", "f", [[569, 705.0, "start"], [551, 705.0, "end"]], false], [13, 14, "M560,775.0 L560,801.0", null, null, [[569, 789.0, "start"], [551, 789.0, "end"]], false], [4, 15, "M900,201.0 L900,886.0 L578,886.0", null, null, [], false], [9, 15, "M586,472.0 L900,472.0 L900,886.0 L578,886.0", "참", "t", [[743.0, 464.0, "middle"], [743.0, 489.0, "middle"]], false], [12, 15, "M586,672.0 L900,672.0 L900,886.0 L578,886.0", "참", "t", [[743.0, 664.0, "middle"], [743.0, 689.0, "middle"]], false], [15, 16, "M560,899.0 L560,925.0", null, null, [[569, 913.0, "start"], [551, 913.0, "end"]], false], [16, 17, "M560,975.0 L560,1001.0", null, null, [[569, 989.0, "start"], [551, 989.0, "end"]], false]], "COND": {"3": "이미 허용돼 있나", "5": "권한 창이 이미 떠 있나", "9": "허용했나", "12": "‘진동만 측정’을 골랐나"}, "REP": []};

const NS="http://www.w3.org/2000/svg";
const el=(t,at)=>{const e=document.createElementNS(NS,t);for(const k in at)e.setAttribute(k,at[k]);return e;};
const url=x=>B+x.p+"#L"+x.a+"-L"+x.b;
const fnl=fns=>fns.map(z=>z.n+"  "+z.p.split("/").pop()+" L"+z.a+"–L"+z.b).join("\n");
// 선분 목록과 사각형이 겹치는가 (글자 자리 찾기용)
function segHit(r,s){
  const [x1,y1,x2,y2]=s;
  if(Math.abs(x1-x2)<.5){ if(!(r.x<x1&&x1<r.x+r.w))return false;
    return Math.max(Math.min(y1,y2),r.y)<Math.min(Math.max(y1,y2),r.y+r.h); }
  if(Math.abs(y1-y2)<.5){ if(!(r.y<y1&&y1<r.y+r.h))return false;
    return Math.max(Math.min(x1,x2),r.x)<Math.min(Math.max(x1,x2),r.x+r.w); }
  // 비스듬한 선: 잘게 나눠 점으로 본다
  for(let i=0;i<=40;i++){const t=i/40,x=x1+(x2-x1)*t,y=y1+(y2-y1)*t;
    if(r.x<x&&x<r.x+r.w&&r.y<y&&y<r.y+r.h)return true;}
  return false;
}
function boxHit(a,b){return !(a.x+a.w<=b.x||b.x+b.w<=a.x||a.y+a.h<=b.y||b.y+b.h<=a.y);}

const KIND={initial:"시작",merge:"병합",action:"액션",decision:"분기",call:"호출 액션",final:"종료"};
const gr=document.getElementById('rep'),eg=document.getElementById('edges'),
      gl=document.getElementById('glabels'),ng=document.getElementById('nodes');
const svg=document.getElementById('dg'), VB=svg.viewBox.baseVal;

// 반복 구간
D.REP.forEach(r=>{
  gr.appendChild(el("rect",{class:"rep dim",x:r.x,y:r.y,width:r.w,height:r.h,rx:3}));
  const t=el("text",{class:"repl dim",x:r.x+12,y:r.y+19}); t.textContent=r.label; gr.appendChild(t);
});
// 흐름선
const SEGS=[];
D.E.forEach(([a,b,d,lab,kd])=>{
  const p=el("path",{class:"flow dim"+(kd==="back"?" back":""),d:d,"marker-end":"url(#a)"});
  p.dataset.e=a+"|"+b; eg.appendChild(p);
  const pts=d.replace(/[ML]/g,"").trim().split(/\s+/).map(s=>s.split(",").map(Number));
  for(let i=0;i+1<pts.length;i++) SEGS.push({e:a+"|"+b,s:[pts[i][0],pts[i][1],pts[i+1][0],pts[i+1][1]]});
});
// 노드
D.N.forEach(([id,k,name,x,y,desc,fns,doc])=>{
  const a=el("a",doc?{class:"nd dim",href:doc}:{class:"nd dim",href:url(fns[0]),target:"_blank",rel:"noopener"});
  a.dataset.key=id;
  const ti=el("title");
  ti.textContent=(id+". "+(name?name.replace(/\n/g," "):KIND[k]))+(D.COND[id]?"  ["+D.COND[id]+"]":"")+"\n"+desc+
    (doc?"\n(누르면 그 흐름의 액티비티 다이어그램으로 이동)":"")+"\n\n"+fnl(fns);
  a.appendChild(ti);
  let l,t2;
  if(k==="initial"){ a.appendChild(el("circle",{class:"term shape",cx:x,cy:y,r:11})); l=x-11; t2=y-11; }
  else if(k==="final"){ a.appendChild(el("circle",{class:"termring shape",cx:x,cy:y,r:12}));
                        a.appendChild(el("circle",{class:"term",cx:x,cy:y,r:6.5})); l=x-12; t2=y-12; }
  else if(k==="decision"){ a.appendChild(el("path",{class:"shape",d:`M${x},${y-DH} L${x+DW},${y} L${x},${y+DH} L${x-DW},${y} Z`})); l=x-DW; t2=y-DH; }
  else if(k==="merge"){ a.appendChild(el("path",{class:"shape",d:`M${x},${y-13} L${x+18},${y} L${x},${y+13} L${x-18},${y} Z`})); l=x-18; t2=y-13; }
  else{
    a.appendChild(el("rect",{class:"shape",x:x-BW/2,y:y-BH/2,width:BW,height:BH,rx:k==="call"?3:14}));
    if(k==="call"){ const bx=x+BW/2-16, by=y+BH/2-15;
      a.appendChild(el("path",{class:"rake",d:`M${bx-7},${by} h14 M${bx-7},${by} v9 M${bx},${by} v9 M${bx+7},${by} v9`})); }
    l=x-BW/2; t2=y-BH/2;
  }
  if(name){
    const lines=name.split("\n");
    lines.forEach((ln,i)=>{
      const tt=el("text",{class:"lb",x:k==="call"?x-6:x,y:y+(lines.length===1?4.5:(i===0?-4:15))});
      tt.textContent=ln; a.appendChild(tt);
    });
  }
  const nm=el("text",{class:"num",x:l-4,y:t2+2}); nm.textContent=id; a.appendChild(nm);
  ng.appendChild(a);
});

// 글자 자리: 노드 · 선 · 다른 글자 · 반복 구간 테두리와 겹치지 않는 첫 후보
function nodeBox(n){
  const [,k,,x,y]=n;
  if(k==="decision") return {x:x-DW,y:y-DH,w:DW*2,h:DH*2};
  if(k==="merge")    return {x:x-18,y:y-13,w:36,h:26};
  if(k==="initial"||k==="final") return {x:x-13,y:y-13,w:26,h:26};
  return {x:x-BW/2,y:y-BH/2,w:BW,h:BH};
}
const BOXES=D.N.map(n=>Object.assign({id:String(n[0])},nodeBox(n)));
const TXT=[...gr.querySelectorAll('text'),...ng.querySelectorAll('text.num')].map(t=>{const b=t.getBBox();return {x:b.x,y:b.y,w:b.width,h:b.height};});
const REPSEG=[];
D.REP.forEach(r=>{REPSEG.push([r.x,r.y,r.x+r.w,r.y],[r.x,r.y+r.h,r.x+r.w,r.y+r.h],[r.x,r.y,r.x,r.y+r.h],[r.x+r.w,r.y,r.x+r.w,r.y+r.h]);});
function free(r,selfId,selfEdge){
  if(r.x<2||r.y<2||r.x+r.w>VB.width-2||r.y+r.h>VB.height-2) return false;
  if(BOXES.some(b=>b.id!==selfId&&boxHit(r,b))) return false;
  if(TXT.some(b=>boxHit(r,b))) return false;
  if(SEGS.some(s=>s.e!==selfEdge&&segHit(r,s.s))) return false;
  if(REPSEG.some(s=>segHit(r,s))) return false;
  return true;
}
const MISS=[];
// 흐름선 라벨
D.E.forEach(([a,b,d,lab,kd,cands,opt])=>{
  if(!lab) return;
  const t=el("text",{class:"g dim "+(kd||""),x:0,y:0});
  t.textContent=lab; t.dataset.e=a+"|"+b; gl.appendChild(t);
  let ok=null;
  for(const [x,y,an] of cands){
    t.setAttribute("x",x); t.setAttribute("y",y); t.setAttribute("text-anchor",an);
    const bb=t.getBBox(), r={x:bb.x-2,y:bb.y-1,w:bb.width+4,h:bb.height+2};
    if(free(r,null,a+"|"+b)){ok=r;break;}
  }
  if(!ok&&opt){ t.remove(); return; }
  if(!ok){ const [x,y,an]=cands[0]; t.setAttribute("x",x); t.setAttribute("y",y); t.setAttribute("text-anchor",an);
    const bb=t.getBBox(); ok={x:bb.x,y:bb.y,w:bb.width,h:bb.height}; MISS.push("선라벨 "+a+"→"+b); }
  TXT.push(ok);
});
// 분기 조건 문구
D.N.forEach(([id,k,,x,y])=>{
  if(k!=="decision"||!D.COND[id]) return;
  const a=ng.querySelector('[data-key="'+id+'"]');
  const cands=[
    [x+DW+10, y-DH-4,  "start"],
    [x-DW-10, y-DH-4,  "end"],
    [x+DW+12, y+4,     "start"],
    [x-DW-12, y+4,     "end"],
    [x,       y-DH-14, "middle"],
    [x+DW+10, y+DH+14, "start"],
    [x-DW-10, y+DH+14, "end"],
    [x+DW+10, y-DH-22, "start"],
    [x-DW-10, y-DH-22, "end"]
  ];
  const ct=el("text",{class:"cnd",x:0,y:0,"text-anchor":"middle"});
  ct.textContent="["+D.COND[id]+"]";
  a.appendChild(ct);
  let placed=null;
  for(const [cx,cy,an] of cands){
    ct.setAttribute("x",cx); ct.setAttribute("y",cy); ct.setAttribute("text-anchor",an);
    const b=ct.getBBox();
    const r={x:b.x-6,y:b.y-2,w:b.width+12,h:b.height+4};
    if(free(r,String(id),null)){ placed=r; break; }
  }
  if(!placed){
    const [cx,cy,an]=cands[0];
    ct.setAttribute("x",cx); ct.setAttribute("y",cy); ct.setAttribute("text-anchor",an);
    const b=ct.getBBox(); placed={x:b.x-6,y:b.y-2,w:b.width+12,h:b.height+4};
    MISS.push("조건 "+id);
  }
  const bg=el("rect",{class:"cndbg",x:placed.x,y:placed.y,width:placed.w,height:placed.h,rx:2});
  a.insertBefore(bg,ct);
  TXT.push(placed);
});
window.__LABEL_MISS=MISS;
if(MISS.length) console.warn("글자 자리 없음: "+MISS.join(", "));

const nodes=[...ng.querySelectorAll('[data-key]')];
const edges=[...svg.querySelectorAll('[data-e]')];
function iso(id){
  svg.querySelectorAll('.lit').forEach(e=>e.classList.remove('lit'));
  if(!id){svg.classList.remove('iso');return;}
  svg.classList.add('iso');
  const keep=new Set([String(id)]);
  edges.forEach(e=>{const p=e.dataset.e.split('|');
    if(p[0]===String(id)||p[1]===String(id)){e.classList.add('lit');keep.add(p[0]);keep.add(p[1]);}});
  nodes.forEach(n=>{if(keep.has(n.dataset.key))n.classList.add('lit');});
}
nodes.forEach(n=>{
  const k=+n.dataset.key;
  n.addEventListener('mouseenter',()=>iso(k));
  n.addEventListener('mouseleave',()=>iso(null));
  n.addEventListener('focus',()=>iso(k));
  n.addEventListener('blur',()=>iso(null));
});

</script>
