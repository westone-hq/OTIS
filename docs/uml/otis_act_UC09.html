ddle"]], false], [9, 11, "M560,467.0 L560,501.0", "거짓", "f", [[569, 481.0, "start"], [551, 481.0, "end"]], false], [11, 12, "M560,551.0 L560,577.0", null, null, [[569, 565.0, "start"], [551, 565.0, "end"]], false], [12, 13, "M560,627.0 L560,653.0", null, null, [[569, 641.0, "start"], [551, 641.0, "end"]], false], [4, 14, "M900,201.0 L900,738.0 L578,738.0", null, null, [], false], [14, 15, "M560,751.0 L560,777.0", null, null, [[569, 765.0, "start"], [551, 765.0, "end"]], false], [15, 16, "M534,796.0 L232,796.0", "참", "t", [[383.0, 788.0, "middle"], [383.0, 813.0, "middle"]], false], [15, 17, "M560,815.0 L560,849.0", "거짓", "f", [[569, 829.0, "start"], [551, 829.0, "end"]], false], [17, 18, "M560,899.0 L560,925.0", null, null, [[569, 913.0, "start"], [551, 913.0, "end"]], false], [8, 5, "M114.0,376.0 L86.0,376.0 L86.0,242.0 L542,242.0", "고쳐서 다시", "back", [[100.0, 369.0, "middle"], [100.0, 393.0, "middle"], [95.8, 369.0, "middle"], [95.8, 393.0, "middle"], [104.2, 369.0, "middle"], [104.2, 393.0, "middle"], [94.0, 313.0, "start"], [78.0, 313.0, "end"], [94.0, 292.9, "start"], [78.0, 292.9, "end"], [94.0, 333.1, "start"], [78.0, 333.1, "end"], [94.0, 272.8, "start"], [78.0, 272.8, "end"], [94.0, 353.2, "start"], [78.0, 353.2, "end"]], true], [10, 5, "M114.0,448.0 L62.0,448.0 L62.0,242.0 L542,242.0", null, "back", [[88.0, 441.0, "middle"], [88.0, 465.0, "middle"], [80.2, 441.0, "middle"], [80.2, 465.0, "middle"], [95.80000000000001, 441.0, "middle"], [95.80000000000001, 465.0, "middle"], [70.0, 349.0, "start"], [54.0, 349.0, "end"], [70.0, 318.1, "start"], [54.0, 318.1, "end"], [70.0, 379.9, "start"], [54.0, 379.9, "end"], [70.0, 287.2, "start"], [54.0, 287.2, "end"], [70.0, 410.8, "start"], [54.0, 410.8, "end"]], true]], "COND": {"3": "이메일을 지우려 하나", "7": "형식이 틀렸나", "9": "이미 등록된 주소인가", "15": "취소했나"}, "REP": []};

// 선분 목록과 사각형이 겹치는가 (글자 자리 찾기용)
function segHit(r,s){
  const [x1,y1,x2,y2]=s;
  if(Math.abs(x1-x2)<.5){ if(!(r.x<x1&&x1<r.x+r.w))return false;
    return Math.max(Math.min(y1,y2),r.y)<Math.min(Math.max(y1,y2),r.y+r.h); }
  if(Math.abs(y1-y2)<.5){ if(!(r.y<y1&&y1<r.y+r.h))return false;
    return Math.max(Math.min(x1,x2),r.x)<Math.min(Math.max(x1,x2),r.x+r.w); }
  // 비스듬한 선: 잘게 나눠 점으로 본다
  for(let i=0;i<=40;i++){const t=i/40,x=x1+(x2-x1)*t,y=y1+(y2-y1)*t;
    if(r.x<x&&x<r.x+r.w&&r.y<y&&y<r.y+r.h)return true;}
  return false;
}
function boxHit(a,b){return !(a.x+a.w<=b.x||b.x+b.w<=a.x||a.y+a.h<=b.y||b.y+b.h<=a.y);}

D.N.forEach(([id,k,name,x,y,desc,fns,doc])=>{

  let placed=null;
  for(const [cx,cy,an] of cands){
    ct.setAttribute("x",cx); ct.setAttribute("y",cy); ct.setAttribute("text-anchor",an);
    const b=ct.getBBox();
    const r={x:b.x-6,y:b.y-2,w:b.width+12,h:b.height+4};
    if(free(r,String(id),null)){ placed=r; break; }
  }
  if(!placed){
    const [cx,cy,an]=cands[0];
    ct.setAttribute("x",cx); ct.setAttribute("y",cy); ct.setAttribute("text-anchor",an);
    const b=ct.getBBox(); placed={x:b.x-6,y:b.y-2,w:b.width+12,h:b.height+4};
    MISS.push("조건 "+id);
  }
  const bg=el("rect",{class:"cndbg",x:placed.x,y:placed.y,width:placed.w,height:placed.h,rx:2});
  a.insertBefore(bg,ct);
  TXT.push(placed);
});
window.__LABEL_MISS=MISS;
if(MISS.length) console.warn("글자 자리 없음: "+MISS.join(", "));

const nodes=[...ng.querySelectorAll('[data-key]')];
const edges=[...svg.querySelectorAll('[data-e]')];
function iso(id){
  svg.querySelectorAll('.lit').forEach(e=>e.classList.remove('lit'));
  if(!id){svg.classList.remove('iso');return;}
  svg.classList.add('iso');
  const keep=new Set([String(id)]);
  edges.forEach(e=>{const p=e.dataset.e.split('|');
    if(p[0]===String(id)||p[1]===String(id)){e.classList.add('lit');keep.add(p[0]);keep.add(p[1]);}});
  nodes.forEach(n=>{if(keep.has(n.dataset.key))n.classList.add('lit');});
}
nodes.forEach(n=>{
  const k=+n.dataset.key;
  n.addEventListener('mouseenter',()=>iso(k));
  n.addEventListener('mouseleave',()=>iso(null));
  n.addEventListener('focus',()=>iso(k));
  n.addEventListener('blur',()=>iso(null));
});

</script>
</body>
